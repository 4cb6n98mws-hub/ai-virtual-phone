<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">夜局五子棋</title>
  <desc id="desc">深蓝夜色中的木质棋盘、黑白棋子和一盏暖灯</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08121a"/>
      <stop offset=".58" stop-color="#142934"/>
      <stop offset="1" stop-color="#091116"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6a365"/>
      <stop offset=".5" stop-color="#bd8246"/>

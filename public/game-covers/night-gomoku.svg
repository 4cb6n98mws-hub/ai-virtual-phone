    <g stroke="#51321f" stroke-opacity=".72" stroke-width="2">
      <path d="M36 36h388M36 66h388M36 96h388M36 126h388M36 156h388M36 186h388M36 216h388M36 246h388M36 276h388M36 306h388M36 336h388"/>
      <path d="M36 36v300M66 36v300M96 36v300M126 36v300M156 36v300M186 36v300M216 36v300M246 36v300M276 36v300M306 36v300M336 36v300M366 36v300M396 36v300M424 36v300"/>
    </g>
